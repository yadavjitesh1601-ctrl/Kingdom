name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/Android/Sdk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "extras;android;m2repository" || true

      - name: Unzip project if needed
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Extracting $f"
            unzip -o "$f" -d .
          done

      - name: Find Android project root
        id: project_root
        shell: bash
        run: |
          ROOT=$(find . -maxdepth 6 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" \) \
            -exec dirname {} \; | sort -u | head -n 1)
          if [ -z "$ROOT" ]; then
            ROOT="."
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$ROOT"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignOS-Debug-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
